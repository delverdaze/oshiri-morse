name: test

on:
  push:
  pull_request:

# GITHUB_TOKEN の権限を最小化（テストはチェックアウトのみで書き込み不要）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 依存ゼロ（node:test のみ）なので install 不要
      - run: node --test
